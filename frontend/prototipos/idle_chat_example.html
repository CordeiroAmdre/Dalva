<style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md relative overflow-x-hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 bg-background flat no shadows">
<div class="max-w-[720px] mx-auto w-full flex flex-col pt-8 px-margin-mobile md:px-0 pb-4 border-b border-outline-variant/10">
<div class="flex items-center justify-between gap-4">
<button aria-label="Analytics" class="text-primary hover:text-primary-container transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">analytics</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary truncate text-center flex-1" style="letter-spacing: -0.01em;">
                    Dalva — Chat com seus dados
                </h1>
<button aria-label="Settings" class="text-primary hover:text-primary-container transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</div>
<!-- Subtitle extension within header area for better logical grouping -->
<p class="text-body-sm font-body-sm text-on-surface-variant text-center mt-4 max-w-[90%] mx-auto leading-relaxed">
                Faça perguntas sobre produtos, vendas, lojas e pagamentos em linguagem natural.
            </p>
</div>
</header>
<!-- Main Content: Empty State Thread -->
<!-- Padding top accounts for header, padding bottom accounts for composer + bottom nav -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pt-[160px] pb-[220px] max-w-[720px] mx-auto w-full">
<div class="flex flex-col items-center justify-center opacity-80 animate-[fadeIn_0.5s_ease-out]">
<!-- Subtle decorative icon grouping -->
<div class="relative w-24 h-24 mb-6 flex items-center justify-center bg-surface-container rounded-full shadow-sm">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">forum</span>
<div class="absolute -top-1 -right-1 w-8 h-8 bg-surface-container-highest rounded-full flex items-center justify-center border-2 border-background shadow-sm">
<span class="material-symbols-outlined text-tertiary text-[16px]" style="font-variation-settings: 'FILL' 1;">insights</span>
</div>
</div>
<h2 class="text-headline-md font-headline-md text-on-background text-center mb-2">
                Envie uma pergunta para iniciar a conversa.
            </h2>
<p class="text-body-sm font-body-sm text-outline text-center max-w-[280px]">
                Sua assistente analítica está pronta para ajudar.
            </p>
</div>
</main>
<!-- Elevated Composer (Sticky Bottom, above Nav) -->
<!-- Positioned precisely to float above the bottom navigation bar -->
<div class="fixed bottom-[80px] left-0 w-full px-margin-mobile z-40 pb-4">
<div class="max-w-[720px] mx-auto">
<!-- Surface 2 Layer: Highly elevated card -->
<div class="bg-surface-container-lowest rounded-xl p-4 flex flex-col gap-3 transition-all duration-200 border border-outline-variant/30 shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1),0_4px_6px_-2px_rgba(0,0,0,0.05)] focus-within:ring-2 focus-within:ring-primary/20">
<textarea aria-label="Digite sua pergunta" class="w-full bg-transparent border-none resize-none focus:ring-0 text-body-md font-body-md text-on-background placeholder:text-outline p-0 min-h-[48px] max-h-[120px]" id="chat-composer" placeholder="Ex.: Qual foi o valor total de vendas ontem?" rows="2"></textarea>
<div class="flex justify-between items-center pt-2 border-t border-outline-variant/20">
<span class="text-label-md font-label-md text-outline" id="char-counter">0/2000 caracteres restantes</span>
<button aria-label="Enviar mensagem" class="bg-primary text-on-primary rounded-full h-10 w-10 flex items-center justify-center hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 lg:hidden bg-surface border-t border-outline-variant/20 shadow-lg">
<!-- Active Tab: Chat -->
<button aria-current="page" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl py-1 px-4 scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="text-label-md font-label-md mt-1">Chat</span>
</button>
<!-- Inactive Tab: Insights -->
<button class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-4 hover:bg-surface-variant/30 transition-colors rounded-xl">
<span class="material-symbols-outlined">auto_awesome</span>
<span class="text-label-md font-label-md mt-1">Insights</span>
</button>
<!-- Inactive Tab: Perfil -->
<button class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-4 hover:bg-surface-variant/30 transition-colors rounded-xl">
<span class="material-symbols-outlined">person</span>
<span class="text-label-md font-label-md mt-1">Perfil</span>
</button>
</nav>
<!-- Lightweight Interactive Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const composer = document.getElementById('chat-composer');
            const charCounter = document.getElementById('char-counter');
            const MAX_CHARS = 2000;

            // Auto-resize textarea
            composer.addEventListener('input', function() {
                // Reset height to recalculate
                this.style.height = 'auto';
                // Set to scrollHeight up to max-height defined in CSS
                this.style.height = (this.scrollHeight) + 'px';
                
                // Update character count
                const currentLength = this.value.length;
                charCounter.textContent = `${currentLength}/${MAX_CHARS} caracteres restantes`;
                
                // Visual feedback if near limit
                if (currentLength >= MAX_CHARS * 0.9) {
                    charCounter.classList.add('text-error');
                    charCounter.classList.remove('text-outline');
                } else {
                    charCounter.classList.remove('text-error');
                    charCounter.classList.add('text-outline');
                }
            });
        });
    </script>
